name: Platform compatibility

on:
  push:
    branches: [main]
    paths:
      - 'check-*.sh'
      - 'check-windows.ps1'
      - '.github/scripts/**'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - 'check-*.sh'
      - 'check-windows.ps1'
      - '.github/scripts/**'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Validate CI result handling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  unix:
    name: ${{ matrix.os }} / system Bash
    needs: harness
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: /bin/bash -n check-unix.sh
      - name: Scan without fixes or Docker recursion
        run: python3 .github/scripts/run_scan.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scan-${{ matrix.os }}
          path: scan-reports/
          retention-days: 14

  windows:
    name: Windows / ${{ matrix.shell }}
    needs: harness
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test Windows fix planning and failure handling
        shell: ${{ matrix.shell }}
        run: ./.github/scripts/test_windows_fixes.ps1
      - name: Scan without fixes
        shell: pwsh
        env:
          SCAN_SHELL: ${{ matrix.shell }}
        run: python .github/scripts/run_scan.py --windows-shell $env:SCAN_SHELL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scan-windows-${{ matrix.shell }}
          path: scan-reports/
          retention-days: 14

  linux-distros:
    name: Linux / ${{ matrix.name }}
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian:13
          - name: alpine
            image: alpine:latest
          - name: fedora
            image: fedora:latest
          - name: arch
            image: archlinux:latest
          - name: rocky-9
            image: rockylinux:9
          - name: alma-9
            image: almalinux:9
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install scan dependencies and run inside distro
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p scan-reports
          if docker run --rm --pull=always \
            -v "$PWD:/work:ro" -v "$PWD/scan-reports:/reports" -w /work \
            "$DISTRO_IMAGE" sh -ec '
              if command -v apt-get >/dev/null; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y bash coreutils ca-certificates curl git openssl python3 perl gawk grep sed
              elif command -v apk >/dev/null; then
                apk add --no-cache bash coreutils ca-certificates curl git openssl python3 perl gawk grep sed
              elif command -v dnf >/dev/null; then
                dnf install -y bash coreutils ca-certificates curl git openssl python3 perl gawk grep sed
              elif command -v pacman >/dev/null; then
                pacman -Syu --noconfirm --needed bash coreutils ca-certificates curl git openssl python perl gawk grep sed
              elif command -v zypper >/dev/null; then
                zypper --non-interactive refresh
                zypper --non-interactive install bash coreutils ca-certificates curl git openssl python3 perl gawk grep sed
              else
                echo "No dependency installer configured for this image" >&2
                exit 1
              fi
              /bin/bash -n check-unix.sh
              python3 .github/scripts/run_scan.py --report-dir /reports
            ' 2>&1 | tee scan-reports/container.log; then
            exit 0
          else
            python3 -c 'from pathlib import Path; text="\n".join(Path("scan-reports/container.log").read_text(errors="replace").splitlines()[-30:]); print("::error title=Container setup or scan failed::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Publish scan outcome
        if: always()
        run: |
          if [ -f scan-reports/summary.md ]; then
            cat scan-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scan-${{ matrix.name }}
          path: scan-reports/
          retention-days: 14

  wsl:
    name: WSL ${{ matrix.version }} / Ubuntu 24.04 / Windows wrapper
    needs: harness
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install an actual WSL distro
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: ${{ matrix.version }}
          additional-packages: bash coreutils ca-certificates curl git openssl python3 perl
      - name: Scan Windows and verify its WSL delegation completed
        shell: pwsh
        run: python .github/scripts/run_scan.py --require-wsl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scan-wsl-${{ matrix.version }}
          path: scan-reports/
          retention-days: 14
